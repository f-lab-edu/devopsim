# devopsim-detector 전용 dashboard.
# grafana_dashboard: "1" label로 kube-prometheus-stack의 grafana-sc-dashboard
# sidecar가 watch → 자동 import.
apiVersion: v1
kind: ConfigMap
metadata:
  name: devopsim-detector-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  devopsim-detector.json: |
    {
      "title": "devopsim-detector",
      "uid": "devopsim-detector",
      "tags": ["devopsim", "detector", "agent"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Investigations (last 1h)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "targets": [
            {
              "expr": "sum(increase(detector_investigations_total[1h]))",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Success Ratio (end_turn)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "targets": [
            {
              "expr": "sum(rate(detector_investigations_total{result=\"end_turn\"}[10m])) / clamp_min(sum(rate(detector_investigations_total[10m])), 0.0001)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red",    "value": null },
                  { "color": "yellow", "value": 0.5 },
                  { "color": "green",  "value": 0.8 }
                ]
              }
            }
          },
          "options": { "colorMode": "background" }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Tool Calls (last 1h)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "targets": [
            { "expr": "sum(increase(detector_tool_calls_total[1h]))", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Tokens (input, last 1h)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "targets": [
            { "expr": "sum(increase(detector_tokens_used_total{type=\"input\"}[1h]))", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Investigations Rate by Trigger",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum by (trigger) (rate(detector_investigations_total[5m]))",
              "legendFormat": "{{trigger}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ops" } }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Investigations Rate by Result (stop_reason)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum by (result) (rate(detector_investigations_total[5m]))",
              "legendFormat": "{{result}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "ops" },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "end_turn" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } }]
              },
              {
                "matcher": { "id": "byName", "options": "max_steps_exceeded" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } }]
              },
              {
                "matcher": { "id": "byName", "options": "max_tokens_budget_exceeded" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }]
              },
              {
                "matcher": { "id": "byName", "options": "refusal" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }]
              }
            ]
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Investigation Duration (p50/p95/p99)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 0, "y": 12, "w": 24, "h": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(detector_investigation_duration_seconds_bucket[5m])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(detector_investigation_duration_seconds_bucket[5m])))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(detector_investigation_duration_seconds_bucket[5m])))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Tool Calls Rate by Tool",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 0, "y": 20, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum by (tool) (rate(detector_tool_calls_total[5m]))",
              "legendFormat": "{{tool}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ops" } }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Tool Calls Rate by Status",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 12, "y": 20, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum by (status) (rate(detector_tool_calls_total[5m]))",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "ops" },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "ok" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } }]
              },
              {
                "matcher": { "id": "byName", "options": "error" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }]
              }
            ]
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Token Usage Rate by Type",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 0, "y": 28, "w": 24, "h": 8 },
          "targets": [
            {
              "expr": "sum by (type) (rate(detector_tokens_used_total[5m]))",
              "legendFormat": "{{type}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        }
      ]
    }
