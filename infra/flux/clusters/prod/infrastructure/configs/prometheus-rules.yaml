apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devopsim-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus-stack
    role: alert-rules
spec:
  groups:
    - name: api.rules
      interval: 30s
      rules:
        - alert: APIDown
          expr: up{job="serviceMonitor/api/api/0"} == 0
          for: 1m
          labels:
            severity: critical
            service: api
          annotations:
            summary: "API Pod scrape failed for >1m"
            description: "api Pod {{ $labels.pod }}의 /metrics scrape이 1분간 실패. Pod이 죽었거나 메트릭 노출 실패."

        - alert: HighErrorRate
          expr: |
            sum(rate(app_errors_total[5m]))
              / sum(rate(http_requests_total[5m])) > 0.01
          for: 5m
          labels:
            severity: warning
            service: api
          annotations:
            summary: "API error rate > 1%"
            description: "현재 에러율 {{ $value | humanizePercentage }} (5분 평균)"

        - alert: HighLatencyP95
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket[5m]))
            ) > 0.5
          for: 5m
          labels:
            severity: warning
            service: api
          annotations:
            summary: "HTTP p95 latency > 500ms"
            description: "현재 p95 = {{ $value | humanizeDuration }}"

    - name: cache.rules
      interval: 30s
      rules:
        - alert: CacheLowHitRatio
          # 트래픽 없을 때 false positive 방지: 분모가 0.1 rps 이상일 때만
          expr: |
            (
              sum(rate(cache_hits_total[10m]))
                /
              (sum(rate(cache_hits_total[10m])) + sum(rate(cache_misses_total[10m])))
            ) < 0.5
            and
            (sum(rate(cache_hits_total[10m])) + sum(rate(cache_misses_total[10m]))) > 0.1
          for: 10m
          labels:
            severity: warning
            service: api
          annotations:
            summary: "Cache hit ratio < 50% with traffic present"
            description: "현재 hit ratio = {{ $value | humanizePercentage }}"

    - name: db.rules
      interval: 30s
      rules:
        - alert: DBPoolWaiting
          # waiting > 0 단독으로는 false positive 발생 (collect callback race로 항상 1로 잡힘).
          # 진짜 풀 고갈은 idle == 0 AND waiting > 0 — 두 조건 모두 만족해야 fire.
          # read/write split 이후 pool 라벨 분리 필수: 라벨 없이 max() 쓰면 read pool의 idle=1 때문에
          # write pool 고갈 상황에서도 alert가 영원히 안 잡힘. max by (pool)로 pool 단위 매칭.
          expr: |
            max by (pool) (pg_pool_waiting_clients) > 0
              and
            max by (pool) (pg_pool_idle_connections) == 0
          for: 5m
          labels:
            severity: warning
            service: api
          annotations:
            summary: "PG connection pool 고갈 — {{ $labels.pool }} pool idle=0인데 대기 발생"
            description: "{{ $labels.pool }} pool 현재 waiting = {{ $value }}. 풀 max(10) 모두 사용 중. 풀 사이즈 검토 필요."

        - alert: DBSlowQuery
          # read/write split 이후 pool 라벨도 분리. by (le, operation, pool)로 묶어야
          # primary 슬로우 / replica 슬로우를 각각 잡을 수 있음.
          expr: |
            histogram_quantile(0.95,
              sum by (le, operation, pool) (rate(db_query_duration_seconds_bucket[5m]))
            ) > 0.1
          for: 10m
          labels:
            severity: warning
            service: api
          annotations:
            summary: "DB query p95 > 100ms ({{ $labels.operation }} / {{ $labels.pool }} pool)"
            description: "{{ $labels.operation }} 쿼리 ({{ $labels.pool }} pool) p95 = {{ $value | humanizeDuration }}"

    - name: detector.rules
      interval: 30s
      rules:
        - alert: DetectorDown
          # ServiceMonitor scrape이 1분간 실패 → Pod 죽음 or metrics 노출 실패
          expr: up{job="serviceMonitor/detector/detector/0"} == 0
          for: 1m
          labels:
            severity: critical
            service: detector
          annotations:
            summary: "Detector Pod scrape 실패 > 1분"
            description: "detector Pod {{ $labels.pod }}의 /metrics scrape이 1분간 실패."

        - alert: DetectorInvestigationFailureRate
          # 5분간 비정상 종료(stop_reason != end_turn) 비율이 50% 이상 + 분모 0.01 rps 이상
          expr: |
            (
              sum(rate(detector_investigations_total{result!="end_turn"}[5m]))
                /
              sum(rate(detector_investigations_total[5m]))
            ) > 0.5
            and
            sum(rate(detector_investigations_total[5m])) > 0.01
          for: 5m
          labels:
            severity: warning
            service: detector
          annotations:
            summary: "Detector investigation 실패율 > 50% (5분 평균)"
            description: "현재 비정상 종료 비율 = {{ $value | humanizePercentage }}. budget exceeded / max steps / refusal 등이 절반 이상."

        - alert: DetectorHighLatencyP95
          # 단일 investigation이 60s 초과 (p95) → 토큰 budget 직전이거나 tool 응답 느림
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(detector_investigation_duration_seconds_bucket[5m]))
            ) > 60
          for: 10m
          labels:
            severity: warning
            service: detector
          annotations:
            summary: "Detector investigation p95 latency > 60s"
            description: "현재 p95 = {{ $value | humanizeDuration }}. tool 응답 또는 LLM 호출 지연 의심."

        - alert: DetectorToolCallErrorRate
          # 5분간 tool 호출 에러율 > 20% + 분모 0.05 rps 이상
          expr: |
            (
              sum(rate(detector_tool_calls_total{status="error"}[5m]))
                /
              sum(rate(detector_tool_calls_total[5m]))
            ) > 0.2
            and
            sum(rate(detector_tool_calls_total[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
            service: detector
          annotations:
            summary: "Detector tool 호출 에러율 > 20%"
            description: "현재 에러율 = {{ $value | humanizePercentage }}. RBAC / external 시스템 연결 점검 필요."

    - name: prometheus.rules
      interval: 30s
      rules:
        - alert: PrometheusHighMemory
          # limit 2Gi = 2.147e9 bytes의 80% 이상
          expr: process_resident_memory_bytes{job=~".*prometheus.*"} / 2.147e9 > 0.8
          for: 10m
          labels:
            severity: warning
            service: prometheus
          annotations:
            summary: "Prometheus 메모리 사용량 > 80% of limit"
            description: "현재 {{ $value | humanizePercentage }}. cardinality 폭발 또는 query 부담 의심."

        - alert: PrometheusScrapeFailure
          # 타겟이 다운된 경우 (Watchdog 등 항상 up인 self는 제외)
          expr: up == 0
          for: 3m
          labels:
            severity: warning
            service: prometheus
          annotations:
            summary: "Scrape target down: {{ $labels.job }}"
            description: "{{ $labels.job }} 타겟이 3분간 scrape 실패"
