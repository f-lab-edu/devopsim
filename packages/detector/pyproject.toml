[project]
name = "devopsim-detector"
version = "0.0.1"
description = "Agentic SRE detector for devopsim cluster"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "kopf>=1.37.0",
    "kubernetes>=31.0.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.21.0",
    "slack-sdk>=3.33.0",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
