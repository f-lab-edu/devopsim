[project]
name = "devopsim-detector"
version = "0.1.2"
description = "Agentic SRE detector for devopsim cluster"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "kopf>=1.37.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.21.0",
    "slack-sdk>=3.33.0",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803", "N806", "F401"]
